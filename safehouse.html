<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHEEGUN // SAFEHOUSE</title><link rel="stylesheet" href="css/phase17-safehouse.css"></head><body style="margin:0;background:#080a0b"><main class="safehouse"><header class="safehouse-header"><div><a href="game.html" style="color:#59ff87">← RETURN TO EXPEDITION</a><div style="color:#8c9993;margin-top:12px">PHASE 17 // PERSISTENT PROGRESSION</div><h1>FIELD SAFEHOUSE</h1></div><div class="credits" id="credits">0 CREDITS</div></header><div id="log" class="log"></div><section class="safehouse-grid"><article class="safe-card"><h2>OPERATIVE PROGRESSION</h2><div class="stat-row"><span id="level">LEVEL 1</span><span id="xp">0 / 1000 XP</span></div><div class="xpbar"><i id="xpbar"></i></div><div class="stat-row"><span>SUCCESSFUL EXTRACTIONS</span><b id="extracts">0</b></div><div class="stat-row"><span>LOOT EXTRACTED</span><b id="loot">0</b></div><button class="safe-btn" id="claim">CLAIM AVAILABLE PERK POINT</button></article><article class="safe-card"><h2>FIELD STASH</h2><div id="stash">EMPTY</div><button class="safe-btn" id="sell">SELL ALL STASHED LOOT</button></article><article class="safe-card wide"><h2>TRADER // EXPEDITION SUPPLIES</h2><div class="shop-grid" id="shop"></div></article><article class="safe-card"><h2>PERKS</h2><div class="perk-grid" id="perks"></div></article><article class="safe-card"><h2>LOADOUT STATUS</h2><div id="loadout"></div><a class="safe-btn" style="display:block;text-align:center;box-sizing:border-box;text-decoration:none" href="loadout.html">CONFIGURE LOADOUT</a></article></section></main><script src="js/game-state.js"></script><script src="js/phase17-progression.js"></script><script>const P=CheegunProgression,$=id=>document.getElementById(id);function msg(x){$('log').textContent=x}function render(){const d=P.summary(),p=d.profile,s=d.state,x=d.xp;$('credits').textContent=(p.credits||0)+' CREDITS';$('level').textContent='LEVEL '+p.level;$('xp').textContent=x.current+' / '+x.need+' XP';$('xpbar').style.width=x.percent+'%';$('extracts').textContent=p.stats.successfulExtractions||0;$('loot').textContent=p.stats.lootExtracted||0;$('stash').textContent=p.stash?.length?p.stash.map(x=>'<div>'+x+'</div>').join(''):'EMPTY';$('loadout').innerHTML='<div class="stat-row"><span>WEAPON</span><b>'+p.equipped.weapon+'</b></div><div class="stat-row"><span>BACKPACK</span><b>'+p.equipped.backpack+'</b></div><div class="stat-row"><span>ARMOR</span><b>'+ (p.equipped.armor||'NONE')+'</b></div><div class="stat-row"><span>PERK POINTS</span><b>'+s.perkPoints+'</b></div>';$('shop').innerHTML=Object.entries(d.items).map(([id,i])=>'<div class="item"><b>'+i.icon+' '+i.name+'</b><small>'+i.desc+'</small><em>'+i.price+' CREDITS</em><button class="safe-btn" data-buy="'+id+'">BUY</button></div>').join('');$('perks').innerHTML=Object.entries(d.perks).map(([id,i])=>'<div class="item"><b>'+i.icon+' '+i.name+'</b><small>'+i.desc+'</small><em>'+i.cost+' POINT'+(i.cost>1?'S':'')+'</em><button class="safe-btn" data-perk="'+id+'" '+(s.perks.includes(id)?'disabled':'')+'>'+ (s.perks.includes(id)?'UNLOCKED':'UNLOCK')+'</button></div>').join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const r=P.buy(b.dataset.buy);msg(r.ok?'PURCHASE COMPLETE • '+r.item.name:r.reason);render()});document.querySelectorAll('[data-perk]').forEach(b=>b.onclick=()=>{const r=P.unlockPerk(b.dataset.perk);msg(r.ok?'PERK UNLOCKED':r.reason);render()})}$('sell').onclick=()=>{const r=P.sellAll();msg(r.ok?'SOLD '+r.sold+' ITEMS • +'+r.credits+' CREDITS':r.reason);render()};$('claim').onclick=()=>{const r=P.claimPerkPoint();msg(r.ok?'PERK POINT CLAIMED':'NO POINT AVAILABLE YET');render()};render()</script></body></html>
